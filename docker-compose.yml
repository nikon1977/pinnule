services:
  pinnule:
    build: .
    container_name: pinnule
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - type: bind
        source: /
        target: /hostfs
        read_only: true
        bind:
          propagation: rslave
    environment:
      - PORT=4000
    restart: unless-stopped
